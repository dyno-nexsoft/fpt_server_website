targets:
  $default:
    builders:
      json_serializable:
        options:
          # snake_case everywhere on the wire, matching the backend's own
          # build.yaml — the REST payloads speak one convention on both
          # sides instead of the frontend guessing per-field via @JsonKey.
          field_rename: snake
          # Keep null fields out of any request body this app ever POSTs.
          include_if_null: false
          # Nested objects (Job inside SystemStatus/ArtifactListing) must be
          # encoded via their own toJson(), not left as instances.
          explicit_to_json: true
          disallow_unrecognized_keys: false
